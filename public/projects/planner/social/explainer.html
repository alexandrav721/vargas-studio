<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Planner and Book · explainer graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,550&family=Source+Sans+3:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1c1917;--chalk:#f7f3ee;--sage:#5f7a6b;--deep:#3f5548;--mute:#6b645e;--gold:#c9a227;--display:"Fraunces",Georgia,serif;--sans:"Source Sans 3",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(165deg,#e8ece8,#f7f3ee 48%,#ebe4da);overflow:hidden}
.studio-back{position:fixed;top:12px;left:12px;z-index:40;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none;background:#fff;border:1px solid rgba(28,25,23,.12);padding:.55rem .8rem}
body.render .studio-back{display:none}
.g{position:relative;display:flex;flex-direction:column;padding:80px}
.k{font:700 28px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin:0}
h1{font:700 96px/1.02 var(--display);letter-spacing:-.02em;color:var(--deep);margin:24px 0 0}
.steps{display:flex;gap:28px;margin-top:56px}
.step{flex:1;background:#fff;border:2px solid rgba(28,25,23,.12);border-radius:28px;padding:32px 30px;display:flex;flex-direction:column;gap:14px;position:relative}
.step .n{font:700 28px/1 var(--sans);color:var(--mute);letter-spacing:.1em}
.step b{font:700 52px/1 var(--display);color:var(--deep)}
.step span{font:500 30px/1.25 var(--sans);color:#3d3833}
.step svg{width:84px;height:84px}
.money{margin-top:auto;background:#1c1917;color:var(--chalk);border-radius:28px;padding:30px 34px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;font:700 30px/1.2 var(--sans)}
.money .lab{font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);width:100%}
.money .arr{color:var(--gold)}
.money small{font:500 28px/1.1 var(--sans);color:rgba(247,243,238,.78)}
.step .txt{display:flex;flex-direction:column;gap:10px}
.steps{margin-bottom:32px}
.row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:18px;align-items:center;width:100%}
.it small{display:block;margin-top:8px}
.story .row{grid-template-columns:1fr;gap:14px}
.foot{margin-top:26px;font:700 28px/1 var(--sans);color:var(--mute);display:flex;justify-content:space-between}
/* sizes */
.square{width:1080px;height:1080px}
.square h1{font-size:88px}
.square .steps{gap:20px;margin-top:44px}.square .step{padding:26px 22px}.square .step b{font-size:44px}.square .step span{font-size:28px}
.square .money{padding:24px 28px;gap:14px}
.wide{width:1600px;height:900px;padding:56px 88px 48px}
.wide h1{font-size:78px;margin-top:16px}
.wide .steps{margin-top:32px;margin-bottom:24px}.wide .step{padding:24px 28px;gap:10px}.wide .step svg{width:64px;height:64px}.wide .money{padding:22px 32px;gap:10px}.wide .foot{margin-top:16px}
.story{width:1080px;height:1920px;padding:120px 80px}
.story h1{font-size:120px}
.story .steps{flex-direction:column;gap:24px;margin-top:64px;margin-bottom:40px}
.story .step{flex-direction:row;align-items:center;gap:30px;padding:40px}
.story .step .txt{display:flex;flex-direction:column;gap:12px}
.story .step b{font-size:64px}.story .step span{font-size:36px}
.story .money{flex-direction:column;align-items:flex-start;font-size:40px;gap:14px;padding:44px}
.story .money .arr{display:none}.story .it{border-left:4px solid var(--gold);padding-left:20px}
</style></head><body>
<a class="studio-back" href="/">← Vargas Studio</a>
<div class="g" id="g">
  <p class="k">Lumen · paper edition</p>
  <h1>Goals on paper,<br/>and a way back.</h1>
  <div class="steps">
    <div class="step">
      <svg viewBox="0 0 84 84" aria-hidden="true"><rect x="16" y="8" width="52" height="68" rx="6" fill="#f7f3ee" stroke="#3f5548" stroke-width="4"/><line x1="26" y1="30" x2="58" y2="30" stroke="#3f5548" stroke-width="4"/><line x1="26" y1="44" x2="58" y2="44" stroke="#3f5548" stroke-width="4"/><path d="M42 54v16m-7-7 7 7 7-7" fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="txt"><div class="n">1</div><b>Print</b><span>Free Season Chapter sheet</span></div>
    </div>
    <div class="step">
      <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="30" fill="none" stroke="#3f5548" stroke-width="4"/><circle cx="42" cy="42" r="16" fill="none" stroke="#3f5548" stroke-width="4"/><circle cx="42" cy="42" r="5" fill="#c9a227"/></svg>
      <div class="txt"><div class="n">2</div><b>Plan</b><span>One goal, one next move</span></div>
    </div>
    <div class="step">
      <svg viewBox="0 0 84 84" aria-hidden="true"><rect x="8" y="22" width="68" height="40" rx="8" fill="none" stroke="#3f5548" stroke-width="4" stroke-dasharray="7 5"/><path d="M30 42h24m-8-8 8 8-8 8" fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="txt"><div class="n">3</div><b>Return</b><span>Missed a week? No debt.</span></div>
    </div>
  </div>
  <div class="money">
    <span class="lab">How it pays</span>
    <div class="row"><span class="it">Free printable<small>free for everyone</small></span><span class="arr">→</span>
    <span class="it">Physical planner<small>price TBD</small></span><span class="arr">→</span>
    <span class="it">Book in Premium<small>price TBD</small></span></div>
  </div>
  <div class="foot"><span>Planner and Book</span><span>Vargas Studio</span></div>
</div>
<script>
const q=new URLSearchParams(location.search);const s=q.get('size')||'square';
document.getElementById('g').classList.add(['square','wide','story'].includes(s)?s:'square');
if(q.has('render'))document.body.classList.add('render');
</script>
</body></html>
