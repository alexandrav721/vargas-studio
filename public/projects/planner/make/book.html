<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Your planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&display=block">
<link rel="stylesheet" href="planner.css">
<style>
  /* Fill-ins: the buyer's own words, written on the first ruled line */
  .fillin { font: 600 17pt/27px var(--hand); color: #26231f; height: 27px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lines .fillin { margin-top: -3px; }
  .fillwrap { font: 600 15pt/1.25 var(--hand); color: #26231f; }
  @media screen {
    html, body { background: transparent; }
    body { --z: .34; }
    #book { display: grid; grid-template-columns: repeat(auto-fill, calc(8.5in * var(--z))); gap: 22px 16px; justify-content: center; padding: 14px 10px 30px; }
    .slot { width: calc(8.5in * var(--z)); }
    .slot .frame { width: calc(8.5in * var(--z)); height: calc(11in * var(--z)); overflow: hidden; border-radius: 4px;
      box-shadow: 0 1px 2px rgba(28,25,23,.12), 0 6px 18px rgba(28,25,23,.1); background: #fff; }
    .slot .page { zoom: var(--z); margin: 0 !important; box-shadow: none !important; }
    .slot .cap { font: 600 11px/1.3 'DM Sans', system-ui, sans-serif; color: #78716c; margin-top: 6px; text-align: center; }
    body.one #book { grid-template-columns: 1fr; }
  }
  @media print {
    #book, .slot, .frame { display: contents; }
    .cap { display: none; }
  }
</style></head>
<body><div id="book"></div></body></html>
