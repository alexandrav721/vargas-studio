<style>
main{max-width:860px}
.news{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:0;border-top:2px solid var(--ink)}
.news li{padding:16px 0;border-bottom:1px solid var(--line)}
.news b{display:block;font:800 1.2em/1.2 var(--display);letter-spacing:-.015em}
.news p{margin:6px 0 0}
.news .you{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ok-bg)}
.news small{display:block;margin-top:8px;font:600 13px var(--mono);color:var(--muted)}
.news small a{color:inherit}

<body>
<header class="top">
  <a class="logo" href="./">Keep up</a>
  <div class="tools"><a class="chip give" href="../school/support.html" aria-label="Keep it free">♥<span class="gt"> Keep it free</span></a><button class="chip" id="big" type="button" aria-pressed="false">Bigger text</button></div>
</header>
<main>
  <p class="label">Keep up, made easy</p>
  <h1>This week in AI, in plain words.</h1>
  <p class="muted">No hype. What changed, and what it means for you. New every Friday.</p>

  <section class="sec" id="news" aria-labelledby="news-h">
    <h2 id="news-h">This week</h2>
    <p class="muted" id="news-week"></p>
    <ul class="news" id="news-list"></ul>
  </section>

  <p class="freebox" style="margin-top:32px"><b>Free, all of it.</b> New news every Friday. <a href="../school/social/">See our Instagram posts</a>.</p>
</main>
<script src="../school/school.js" defer></script>
<script>
/* Update every Friday from real sources (same list as the Friday Instagram post). */
var NEWS = { week: "Week of Nov 17, 2026", items: [
  { headline: "ChatGPT now types as you talk", what: "OpenAI rolled out Live Dictation to every ChatGPT plan. Your words appear as you speak, with no 10-minute limit.", you: "Tap the mic to dictate long notes or messages, even on the free plan.", source: "OpenAI", url: "https://help.openai.com/en/articles/6825453-chatgpt-release-notes", date: "Nov 18" },
  { headline: "That panicked grandkid call could be fake", what: "The FTC warned that scammers clone a grandchild's voice or fake a video call, then demand urgent, secret payment.", you: "Hang up and call another relative to check before sending any money or gift cards.", source: "Federal Trade Commission", url: "https://consumer.ftc.gov/consumer-alerts/2026/11/grandpa-i-need-your-help-how-spot-and-avoid-grandkid-scams", date: "Nov 18" },
  { headline: "New York sets up an AI watchdog team", what: "New York's attorney general created a unit to enforce a new AI safety law and police AI scams and privacy.", you: "New Yorkers get a place to report AI harms. The law starts January 1, 2027.", source: "New York State Attorney General", url: "https://ag.ny.gov/press-release/2026/attorney-general-james-announces-creation-ai-safety-standards-enforcement-and", date: "Nov 17" }
] };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
document.getElementById("news-week").textContent = NEWS.week;
document.getElementById("news-list").innerHTML = NEWS.items.map(function (n) {
  return "<li><b>" + esc(n.headline) + "</b><p>" + esc(n.what) + '</p><p class="you"><b style="display:inline;font:inherit;font-weight:700">For you:</b> ' + esc(n.you) + '</p><small><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.source) + "</a> · " + esc(n.date) + "</small></li>";
}).join("");
</script>
<script src="/projects/skill-quest/smez-index.js" defer></script>
<script src="/projects/skill-quest/smez-nav.js" data-section="keepup" defer></script>
</body>
