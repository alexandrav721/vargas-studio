<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demand test results · Skills Made EZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="try.css">
<style>
  .grid{display:grid;gap:28px;margin-top:20px}
  @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
  .col h2{font-size:26px}
  .stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .stat b{font:700 18px var(--mono)}
  .col .stat:first-of-type{border-top:2px solid var(--ink)}
  .verdict{margin-top:28px;border-left:3px solid var(--accent);padding:6px 0 6px 14px;max-width:70ch}
  table{border-collapse:collapse;width:100%;font-size:14.5px;margin-top:10px}
  th,td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
  th{font-size:12.5px;color:var(--muted);border-bottom:2px solid var(--ink)}
  main{padding:30px 0 60px}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo">Skills Made <b>EZ</b><small>Demand test results</small></span></div></header>
<main><div class="wrap" id="out"><p class="note">Loading…</p></div></main>
<script>
(function () {
  var out = document.getElementById("out");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  fetch("/api/sl/demand/stats", { credentials: "same-origin" }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw Object.assign(new Error(j.error || "Error"), { status: r.status }); return j; });
  }).then(function (j) {
    function n(page, ev) { var x = j.counts.find(function (c) { return c.page === page && c.event === ev; }); return x ? x.n : 0; }
    function pct(a, b) { return b ? (100 * a / b).toFixed(1) + "%" : "–"; }
    var P = { marketers: "Marketing kit · $39", everyday: "Cooking school · $19" };
    var cols = Object.keys(P).map(function (p) {
      var v = n(p, "view"), c = n(p, "cta"), r = n(p, "reserve");
      return '<div class="col"><h2>' + P[p] + '</h2>' +
        '<div class="stat"><span>Visitors</span><b>' + v + '</b></div>' +
        '<div class="stat"><span>Clicked pre-order</span><b>' + c + ' · ' + pct(c, v) + '</b></div>' +
        '<div class="stat"><span>Reserved with email</span><b>' + r + ' · ' + pct(r, v) + '</b></div>' +
        '<p class="note"><a href="' + p + '/">Open the page</a></p></div>';
    }).join("");
    var mv = n("marketers", "view"), mr = n("marketers", "reserve"), ev = n("everyday", "view"), er = n("everyday", "reserve");
    var mRate = mv ? mr / mv : 0, eRate = ev ? er / ev : 0;
    var verdict = mv + ev < 100 ? "Too early to call: fewer than 100 visitors in total."
      : (mr >= 10 || (mv >= 300 && mRate >= 0.03)) && mRate >= 2 * eRate ? "Marketers look like the first paid audience (10+ reservations, at least 2x the everyday page)."
      : mr < 5 && er < 5 ? "Neither page has 5 reservations yet. Fix the offer and the proof before choosing."
      : "No clear winner yet. Keep sending the same effort to both.";
    var rows = j.reservations.map(function (x) { return "<tr><td>" + esc(x.page) + "</td><td>" + esc(x.email) + "</td><td>" + esc(x.role) + "</td><td>" + esc(x.source) + "</td><td>" + new Date(x.at).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + "</td></tr>"; }).join("");
    var src = j.sources.map(function (x) { return "<tr><td>" + esc(x.page) + "</td><td>" + esc(x.source) + "</td><td>" + x.n + "</td></tr>"; }).join("");
    out.innerHTML = '<h1 style="font-size:clamp(32px,5vw,46px)">Which kitchen do people want?</h1>' +
      '<p class="lede">Reservations are emails, not payments: a softer signal than a paid pre-order. Each visitor counts once per page.</p>' +
      '<div class="grid">' + cols + '</div>' +
      '<p class="verdict"><b>Read:</b> ' + verdict + '</p>' +
      '<h2 style="margin-top:40px;font-size:24px">Where visitors came from</h2><table><tr><th>Page</th><th>utm_source</th><th>Visitors</th></tr>' + (src || '<tr><td colspan="3">None yet</td></tr>') + '</table>' +
      '<h2 style="margin-top:40px;font-size:24px">Reservations</h2><table><tr><th>Page</th><th>Email</th><th>Role</th><th>Source</th><th>Date</th></tr>' + (rows || '<tr><td colspan="5">None yet</td></tr>') + '</table>';
  }).catch(function (e) {
    out.innerHTML = e.status === 401 || e.status === 403
      ? '<h1 style="font-size:36px">Reviewers only</h1><p class="lede">Sign in to the <a href="../library/#/signin">community library</a> with your reviewer email, then come back.</p>'
      : '<p class="lede">Couldn\'t load the results. Try again.</p>';
  });
})();
</script>
</body>
</html>
