<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Builder words challenge · Builder’s Kitchen</title>
<meta name="description" content="15 quick questions across every Builder’s Kitchen lesson. Do you speak builder?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../school.css">
<style>
.qcard{margin-top:14px}
.qcard .pic{font-size:1.25rem;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;margin:6px 0 4px}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:3.2rem;font-weight:800;text-align:center;margin:10px 0 0}
.review{list-style:none;padding:0;margin:14px 0 0}
.review li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.review a{font-weight:600}
</style>
<link rel="stylesheet" href="/site-bar.css" />
<script src="/site-bar.js" data-project="skill-quest" data-kind="piece" defer></script>
</head>
<body>
<header class="top">
  <a class="logo" href="./">AI Made EZ <small>Builder’s Kitchen</small></a>
  <div class="tools"><button class="chip" id="big" type="button" aria-pressed="false">Bigger text</button></div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="foot"><a href="./">Builder’s passport</a><a href="glossary.html">Kitchen dictionary</a><span>Not affiliated with Anthropic</span><span>Made by Alexandra Vargas</span></footer>
<script src="../../sounds.js" defer></script>
<script src="../school.js" defer></script><script src="bk.js" defer></script><script src="words.js" defer></script><script src="mem.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var W = window.BK_WORDS, esc = BK.esc, app = document.getElementById("app"), N = 15;
  function play(n, x) { if (window.SQSound) window.SQSound.play(n, x); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var qs, i, right, missed, seen = [];
  var U = window.BK_UNTAUGHT || [], doneL = BK.done(), REVIEW = /review=1/.test(location.search);
  var TW = W.filter(function (w) { return U.indexOf(w[0]) < 0; });
  var finished = BK.TRACK.filter(function (l) { return doneL[l.id]; }).map(function (l) { return l.n; });
  var POOL = finished.length >= 2 ? TW.filter(function (w) { return finished.indexOf(w[4]) >= 0; }) : TW;
  function start() {
    var dueT = window.BKM ? BKM.due(POOL.map(function (w) { return w[0]; })) : [];
    var dueW = shuffle(POOL.filter(function (w) { return dueT.indexOf(w[0]) >= 0; }));
    var byL = {}; POOL.forEach(function (w) { (byL[w[4]] = byL[w[4]] || []).push(w); });
    var fresh = function (w) { return seen.indexOf(w[0]) < 0; };
    if (POOL.filter(fresh).length < N) seen = [];
    var pick = dueW.slice(0, N);
    if (!REVIEW || pick.length < 5) {
      Object.keys(byL).forEach(function (k) { if (pick.length >= N) return; var c = shuffle(byL[k].filter(function (w) { return fresh(w) && pick.indexOf(w) < 0; })); if (c.length) pick.push(c[0]); });
      var rest = shuffle(POOL.filter(function (w) { return pick.indexOf(w) < 0 && fresh(w); }));
      pick = pick.concat(rest.slice(0, N - pick.length));
    }
    pick = shuffle(pick.slice(0, N));
    qs = pick.map(function (w, k) {
      var kind = [1, 2, 1, 0, 1, 2, 1, 2, 1, 0][k % 10]; // mostly real meaning (1) and meeting lines (2), some kitchen pictures (0)
      var re = new RegExp(w[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "[ -]?") + "(s|ed|ing|en)?", "i");
      var heard = w[5] && re.test(w[5]) ? "“" + w[5].replace(re, "___") + "”" : null;
      if (kind === 2 && !heard) kind = 0;
      var asKitchen = kind === 0;
      var lw = w[0].toLowerCase();
      var big = function (t) { return (t.toLowerCase().match(/[a-z]{5,}/g) || []); };
      var ok = function (o) { var lo = o[0].toLowerCase(); if (o === w || lo.indexOf(lw) >= 0 || lw.indexOf(lo) >= 0) return false; var a = big(w[1]); return !big(o[1]).some(function (x) { return a.indexOf(x) >= 0; }); };
      var same = shuffle(W.filter(function (o) { return o[4] === w[4] && ok(o); })).slice(0, 1);
      var others = same.concat(shuffle(W.filter(function (o) { return o[4] !== w[4] && ok(o); })).slice(0, 2 - same.length));
      var meaning = w[2].indexOf(": ") > 0 && w[2].indexOf(": ") < 40 ? w[2].slice(w[2].indexOf(": ") + 2) : w[2];
      meaning = meaning.charAt(0).toUpperCase() + meaning.slice(1);
      return { w: w, prompt: kind === 2 ? heard : asKitchen ? w[1] : meaning, kind: kind === 2 ? "In a meeting you hear… which word fills the gap?" : asKitchen ? "In the kitchen, this is…" : "Which word means…", opts: shuffle([w].concat(others)) };
    });
    pick.forEach(function (w) { seen.push(w[0]); });
    i = 0; right = 0; missed = []; draw();
  }
  function draw() {
    if (i >= qs.length) return end();
    var q = qs[i];
    app.innerHTML = '<div class="prog"><span>Question ' + (i + 1) + " of " + qs.length + '</span><span class="bar"><i style="width:' + Math.round((i + 1) / qs.length * 100) + '%"></i></span></div>' +
      '<section class="qcard"><p class="label">' + q.kind + '</p><p class="pic">' + esc(q.prompt) + '</p><ul class="claims">' +
      q.opts.map(function (o, j) { return '<li><button type="button" data-j="' + j + '">' + esc(o[0]) + "</button></li>"; }).join("") + '</ul><div id="fb"></div></section>';
    app.querySelectorAll("[data-j]").forEach(function (b) {
      b.onclick = function () {
        if (app.querySelector(".fbdone")) return;
        var o = q.opts[+b.dataset.j], ok = o === q.w, fb = document.getElementById("fb"); if (window.BKM) BKM.record(q.w[0], ok);
        b.classList.add(ok ? "right" : "wrong");
        if (ok) { right++; play("tick", right); } else { missed.push(q.w); play("pick"); app.querySelectorAll("[data-j]").forEach(function (x) { if (q.opts[+x.dataset.j] === q.w) x.classList.add("right"); }); }
        fb.innerHTML = '<p class="fb ' + (ok ? "good" : "try") + ' fbdone">' + (ok ? "Yes. <b>" + esc(q.w[0]) + "</b>: " : "It’s <b>" + esc(q.w[0]) + "</b>: ") + esc(q.w[2]) + '</p><div class="btns"><button class="btn" id="nx" type="button">' + (i + 1 < qs.length ? "Next" : "See my score") + "</button></div>";
        document.getElementById("nx").onclick = function () { i++; draw(); window.scrollTo(0, 0); };
        document.getElementById("nx").focus();
      };
    });
  }
  function end() {
    var pct = right / qs.length, line = pct === 1 ? "Perfect. You speak builder." : pct >= 0.8 ? "You speak builder." : pct >= 0.5 ? "Getting fluent. Review the words below." : "A good start. Each word below links to its lesson.";
    try { var best = +(localStorage.getItem("smez-builders-best") || 0); if (right > best) localStorage.setItem("smez-builders-best", String(right)); } catch (e) {}
    app.innerHTML = '<p class="label" style="text-align:center">Builder words challenge</p><p class="score">' + right + "/" + qs.length + '</p><h1 style="text-align:center">' + line + "</h1>" +
      (window.BKM ? '<p class="muted" style="text-align:center">Words you know: ' + BKM.knownCount(TW.map(function (w) { return w[0]; })) + " of " + TW.length + ". Missed words come back first next time.</p>" : "") +
      (missed.length ? '<h2>Words to review</h2><ul class="review">' + missed.map(function (w) { var l = BK.TRACK[w[4] - 1]; return '<li><b>' + esc(w[0]) + "</b> = " + esc(w[1]) + ' · <a href="glossary.html#' + w[0].toLowerCase().replace(/[^a-z0-9]+/g, "-") + '">look it up</a> · <a href="' + l.href + '">Lesson ' + l.n + "</a></li>"; }).join("") + "</ul>" : "") +
      '<div class="btns"><button class="btn" id="again" type="button">New 15 words</button><button class="btn ghost" id="copy" type="button">Copy my score</button></div>';
    document.getElementById("again").onclick = start;
    document.getElementById("copy").onclick = function () {
      var t = "I got " + right + "/" + qs.length + " on the Builder words challenge (AI Made EZ). API, MCP, RAG, agents, evals… " + location.href;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { School.toast("Score copied"); }, function () { School.toast("Select the text and copy it"); });
    };
  }
  var KT = window.BKM ? BKM.knownCount(TW.map(function (w) { return w[0]; })) : 0, DUE = window.BKM ? BKM.due(POOL.map(function (w) { return w[0]; })).length : 0;
  app.innerHTML = '<p class="label">' + (REVIEW ? "Review" : "Builder words challenge") + ' · up to 15 questions · about 4 minutes</p><h1>' + (REVIEW ? "Quick review." : "Do you speak builder?") + "</h1>" +
    '<p class="muted">Words you know: ' + KT + " of " + TW.length + "." + (DUE ? " " + DUE + " due for review, they come first." : "") + (finished.length >= 2 ? " Only words from lessons you’ve finished." : "") + "</p>" +
    '<div class="btns"><button class="btn" id="go" type="button">Start</button></div>';
  document.getElementById("go").onclick = start;
});
</script>
<script src="/projects/skill-quest/smez-index.js" defer></script>
<script src="/projects/skill-quest/smez-nav.js" data-section="school" defer></script>
</body>
</html>
