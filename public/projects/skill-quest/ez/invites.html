<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Birthday invitations · AI Made EZ</title>
<meta name="description" content="Say who the party is for. Watch the card build itself, pick from 3 designs, and print or send it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Fredoka:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../school/school.css">
<link rel="stylesheet" href="invites.css">
</head>
<body class="inv">
<header class="top">
  <a class="logo" href="./">AI Made EZ<small>Invitations</small></a>
  <div class="tools">
    <button class="chip" id="big" type="button" aria-pressed="false" title="Bigger text">Bigger text</button>
    <button class="chip" id="sound" type="button" aria-pressed="false">Sound on</button>
  </div>
</header>
<main class="studio" id="app">
  <section class="right" aria-label="Your invitation">
    <div class="rhead"><h1 id="rtitle">Your card, building live</h1><div id="rtools"></div></div>
    <div id="view"></div>
  </section>
  <div class="left">
    <section class="box" aria-label="Conversation">
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="compose" id="compose">
        <label class="sr" for="say">Type your answer</label>
        <input id="say" autocomplete="off" maxlength="300" placeholder="Type, or tap an option">
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
    <section class="box plan" aria-label="What I'll ask">
      <h2>What I'll ask you</h2>
      <div class="seg" role="group" aria-label="How deep">
        <button type="button" data-depth="quick" aria-pressed="false">Quick<small>3 questions</small></button>
        <button type="button" data-depth="good" aria-pressed="true">Good<small>6 questions</small></button>
        <button type="button" data-depth="perfect" aria-pressed="false">Perfect<small>9 questions</small></button>
      </div>
      <ul class="qs" id="qs"></ul>
      <div class="meter" id="meter"></div>
      <details class="peek"><summary>See what Claude reads</summary><pre id="prompt"></pre></details>
      <button class="linkb" type="button" id="restart">Start a new invitation</button>
    </section>
  </div>
</main>
<footer class="foot"><a href="./">All planners</a><a href="../school/">AI Made EZ</a><span>Your invitation stays on this device.</span><span>Not affiliated with Anthropic</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../sounds.js" defer></script>
<script src="../school/school.js" defer></script>
<script src="invites.js" defer></script>
<script src="/projects/skill-quest/smez-index.js" defer></script>
<script src="/projects/skill-quest/smez-nav.js" data-section="school" defer></script>
</body>
</html>
