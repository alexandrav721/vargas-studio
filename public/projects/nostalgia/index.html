<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scrollback — Who were you?</title>
  <meta name="description" content="Pick the year you were 15. Tap what you had. Find out who you were." />
  <meta property="og:title" content="Who were you? — Scrollback" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Pick the year you were 15. Tap what you had. Find out who you were." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./play.css" />
  <link rel="stylesheet" href="/site-bar.css" />
  <script src="/site-bar.js" data-project="nostalgia" data-kind="game" defer></script>
</head>
<body data-era="dialup" class="play-body">
  <a class="studio-back" href="/">← Vargas Studio</a>
  <button class="mute-btn" type="button" id="mute" aria-pressed="true" aria-label="Sound on. Turn sound off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- 1. Boot -->
  <section class="beat is-on" id="beat-boot" aria-label="Pick your year">
    <div class="crt-big">
      <div class="crt-glass">
        <p class="boot-line" aria-hidden="true">C:\&gt;<span class="cursor"></span></p>
        <h1 class="boot-ask">What year were you 15?</h1>
        <div class="wheel" role="group" aria-label="Year">
          <button class="wheel-step" type="button" data-step="-1" aria-label="Earlier year">‹</button>
          <div class="wheel-strip" id="wheel" tabindex="0" aria-live="polite"></div>
          <button class="wheel-step" type="button" data-step="1" aria-label="Later year">›</button>
        </div>
      </div>
    </div>
    <button class="go-btn" type="button" id="go">Go</button>
  </section>

  <!-- 1b. Join a group (only from a group link) -->
  <section class="beat" id="beat-join" aria-label="Join the group" aria-labelledby="join-ask">
    <ul class="join-faces" id="join-faces" aria-hidden="true"></ul>
    <h1 class="join-ask" id="join-ask" tabindex="-1"></h1>
    <form class="join-form" id="join-form">
      <label class="join-name">
        <span>Your first name (optional)</span>
        <input id="join-name" maxlength="12" autocomplete="given-name" enterkeyhint="go" placeholder="Jo" />
      </label>
      <button class="go-btn" type="submit" id="join-go">Go</button>
    </form>
    <div class="reveal-more">
      <button class="quiet-link" type="button" id="join-year">Different year?</button>
      <button class="quiet-link" type="button" id="join-see" hidden>See the group</button>
    </div>
  </section>

  <!-- 2. Dial in -->
  <section class="beat" id="beat-dial" aria-label="Connecting">
    <div class="dial-text" id="dial-text" aria-live="polite"></div>
  </section>

  <!-- 3. Play -->
  <section class="beat" id="beat-play" aria-label="Was this yours?">
    <div class="play-top">
      <h2 class="play-ask">Was this yours?</h2>
      <span class="play-count" id="play-count"></span>
    </div>
    <div class="deck" id="deck"></div>
    <div class="answers">
      <button class="ans ans--nope" type="button" data-ans="nope" aria-keyshortcuts="ArrowLeft">Nope</button>
      <button class="ans ans--want" type="button" data-ans="wanted" aria-keyshortcuts="ArrowUp">Wanted it</button>
      <button class="ans ans--had" type="button" data-ans="had" aria-keyshortcuts="ArrowRight">Had it</button>
    </div>
  </section>

  <!-- 4. Reveal -->
  <section class="beat" id="beat-reveal" aria-label="Who you were">
    <p class="reveal-lead" id="reveal-lead"></p>
    <h2 class="reveal-name" id="reveal-name"></h2>
    <p class="reveal-tag" id="reveal-tag" hidden></p>
    <p class="reveal-common" id="reveal-common" hidden></p>
    <div class="pile" id="pile" aria-hidden="true"></div>
    <label class="reveal-away">
      <span>Away message to 15-year-old you</span>
      <input id="away" maxlength="60" placeholder="brb, growing up" />
    </label>
    <div class="reveal-actions">
      <button class="go-btn" type="button" id="send">Send to a friend</button>
      <button class="ghost-btn" type="button" id="save">Save card</button>
      <a class="ghost-btn" id="print" href="./print-yours.html">Make it a print</a>
    </div>
    <section class="group" id="group" hidden aria-labelledby="group-head">
      <h3 class="group-head" id="group-head"></h3>
      <p class="group-fun" id="group-fun" hidden></p>
      <ol class="roster" id="roster"></ol>
      <div class="reveal-actions">
        <button class="go-btn" type="button" id="add-friends">Add your friends</button>
        <button class="ghost-btn" type="button" id="save-group">Save group card</button>
        <a class="ghost-btn" id="print-group" href="./print-yours.html">Make it a print</a>
      </div>
      <p class="group-note" id="group-note">No live room: the group lives in the link. Pass it on.</p>
    </section>
    <div class="reveal-more">
      <button class="quiet-link" type="button" id="save-mine" hidden>Save my card</button>
      <button class="quiet-link" type="button" id="again">Play another year</button>
      <a class="quiet-link" id="room-link" href="./explore.html">Walk into your room →</a>
      <a class="quiet-link" href="./credits.html">Photo credits</a>
    </div>
  </section>

  <script type="module" src="./play.js"></script>
</body>
</html>
