<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080" />
  <title>Restitch ad frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0c1612; --ink-2:#15241d; --fog:#d7e4dc; --mist:#a8bfb2; --paper:#eef5f0; --citrus:#d6f26a; --warm:#f0c9a0; --display:"Fraunces", Georgia, serif; --sans:"Sora", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background-color: #0c1612; }
    .f { position: relative; width: 1080px; height: 1350px; padding: 72px 80px 64px; color: var(--paper); font-family: var(--sans);
      background: radial-gradient(900px 700px at 0% 0%, rgba(214,242,106,0.13), transparent 60%), radial-gradient(800px 700px at 100% 100%, rgba(240,201,160,0.11), transparent 60%), #0c1612;
      display: flex; flex-direction: column; }
    .f.paper { background: #eef5f0; color: #0c1612; }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .mark { font: 600 46px var(--display); letter-spacing: -0.02em; color: var(--citrus); }
    .paper .mark { color: #0c1612; }
    .tag { font: 600 28px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--warm); }
    .paper .tag { color: #6b4a1f; }
    .art { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    h1 { margin: 0; font: 600 104px/0.98 var(--display); letter-spacing: -0.035em; font-variation-settings: "SOFT" 40, "opsz" 144; }
    h1 em { font-style: normal; color: var(--citrus); }
    .paper h1 em { color: #3d5a10; }
    .sub { margin: 26px 0 0; font: 500 34px/1.3 var(--sans); color: var(--fog); max-width: 860px; }
    .paper .sub { color: #23352c; }
    .foot { display: flex; justify-content: space-between; gap: 24px; margin-top: 40px; padding-top: 26px; border-top: 2px solid rgba(215,228,220,0.22); font: 500 28px var(--sans); color: var(--mist); }
    .paper .foot { border-top-color: rgba(12,22,18,0.2); color: #34483d; }
    .chip { display: inline-flex; align-items: center; gap: 14px; padding: 14px 22px; border: 2px solid rgba(215,228,220,0.3); font: 600 30px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--fog); }
    .chip.on { border-color: var(--citrus); color: var(--ink); background: var(--citrus); }
    .chip i { width: 30px; height: 30px; display: inline-block; border: 2px solid rgba(238,245,240,0.5); }
    .src { font: 500 28px var(--sans); color: var(--mist); margin-top: 18px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    var dress = function (fill, stroke) {
      return '<path d="M196 40 L246 18 Q290 62 334 18 L384 40 L404 270 Q446 640 494 1010 L86 1010 Q134 640 176 270 Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="6" stroke-linejoin="round"/><path d="M246 18 Q290 72 334 18" fill="none" stroke="' + stroke + '" stroke-width="6"/>';
    };
    var F = {
      1: { tag: "Save money", art:
        '<svg width="900" height="640" viewBox="0 0 900 640"><g transform="translate(60,20) scale(0.6)">' + dress("none", "#eef5f0") + '</g>' +
        '<path d="M300 140 L470 110" stroke="#f0c9a0" stroke-width="5"/><g transform="translate(470,60) rotate(-8)"><path d="M0 40 L60 0 L330 0 L330 170 L60 170 L0 130 Z" fill="#f0c9a0"/><circle cx="40" cy="85" r="14" fill="#0c1612"/><text x="90" y="80" font-family="Sora" font-weight="600" font-size="34" fill="#0c1612" letter-spacing="3">THRIFT</text><text x="90" y="135" font-family="Fraunces" font-weight="600" font-size="48" fill="#0c1612">find</text></g>' +
        '<g transform="translate(500,330)"><rect width="330" height="200" fill="none" stroke="#d6f26a" stroke-width="4" stroke-dasharray="14 10"/><text x="30" y="80" font-family="Sora" font-weight="600" font-size="34" fill="#d6f26a" letter-spacing="3">PLAN</text><text x="30" y="150" font-family="Fraunces" font-weight="600" font-size="64" fill="#d6f26a">$0</text></g></svg>',
        h: 'The find was cheap.<br><em>The plan is free.</em>', sub: 'Photo in, three flips out: no-sew, hand, machine.' },
      2: { tag: "No machine? Fine", art:
        '<div style="display:flex;flex-direction:column;gap:26px;align-items:flex-start"><span class="chip on">No-sew · knot, pin, snap</span><span class="chip">Hand · needle and thread</span><span class="chip">Machine · when you\'re ready</span></div>',
        h: 'Every read has a <em>no-sew</em> flip.', sub: 'No pattern to buy. No machine needed to start.' },
      3: { tag: "Your fit", paper: true, art:
        '<svg width="920" height="560" viewBox="0 0 920 560"><g transform="rotate(-6 460 120)"><rect x="20" y="70" width="880" height="100" fill="#f0c9a0" stroke="#0c1612" stroke-width="4"/>' +
        Array.from({length: 23}, function (_, i) { var x = 50 + i * 37; return '<line x1="' + x + '" y1="70" x2="' + x + '" y2="' + (i % 5 === 0 ? 125 : 102) + '" stroke="#0c1612" stroke-width="4"/>'; }).join("") +
        '</g><g font-family="Sora" font-size="34" fill="#0c1612"><text x="40" y="330" font-weight="600">Full bust</text><line x1="330" y1="334" x2="880" y2="334" stroke="#0c1612" stroke-width="3"/><text x="40" y="420" font-weight="600">Waist</text><line x1="330" y1="424" x2="880" y2="424" stroke="#0c1612" stroke-width="3"/><text x="40" y="510" font-weight="600">Hip</text><line x1="330" y1="514" x2="880" y2="514" stroke="#0c1612" stroke-width="3"/><text x="350" y="320" fill="#34483d">you type it</text></g></svg>',
        h: 'Your tape.<br><em>Not a size chart.</em>', sub: 'The photo never guesses your size. Each flip shows the numbers you typed.' },
      4: { tag: "Real read", art:
        '<div style="display:grid;grid-template-columns:260px 1fr;gap:44px;align-items:center;width:920px"><img src="../shots/sample-file.png" alt="" style="width:260px;height:auto;display:block"><div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start"><span class="chip"><i style="background:#3f5e85"></i>#3F5E85</span><span class="chip">Brightness 35%</span><span class="chip">Aspect 0.38</span><p style="margin:10px 0 0;font:600 40px/1.2 Fraunces,serif">Reads as a long column.</p><p class="src" style="margin:0">Real output · sample drawing</p></div></div>',
        h: 'The photo names the shape. <em>You bring the tape.</em>', sub: '' },
      5: { tag: "Keep it in rotation", art:
        '<div style="width:920px"><p style="margin:0;font:600 210px/0.9 Fraunces,serif;letter-spacing:-0.04em;color:#d6f26a">11.3M</p><p style="margin:16px 0 0;font:500 44px/1.2 Sora,sans-serif">tons of textiles went to US landfills in 2018.</p><p class="src">Source: US EPA, Textiles material-specific data</p></div>',
        h: 'Flip one piece <em>back into rotation.</em>', sub: '' },
      6: { tag: "Before / after", paper: true, art:
        '<svg width="920" height="640" viewBox="0 0 920 640"><g transform="translate(40,0) scale(0.6)">' + dress("#c9d6ce", "#0c1612") + '</g><text x="160" y="636" font-family="Sora" font-weight="600" font-size="30" fill="#0c1612" text-anchor="middle" letter-spacing="3">BEFORE</text>' +
        '<path d="M380 300 L520 300 M490 270 L520 300 L490 330" fill="none" stroke="#0c1612" stroke-width="6"/>' +
        '<g transform="translate(560,0) scale(0.6)"><path d="M196 40 L246 18 Q290 62 334 18 L384 40 L404 270 Q430 500 450 700 L130 700 Q150 500 176 270 Z" fill="#d6f26a" stroke="#0c1612" stroke-width="6" stroke-linejoin="round"/><path d="M246 18 Q290 72 334 18" fill="none" stroke="#0c1612" stroke-width="6"/><path d="M140 690 L440 690" stroke="#0c1612" stroke-width="5" stroke-dasharray="16 12"/><path d="M180 270 Q290 300 400 270" fill="none" stroke="#0c1612" stroke-width="5" stroke-dasharray="16 12"/></g><text x="734" y="636" font-family="Sora" font-weight="600" font-size="30" fill="#0c1612" text-anchor="middle" letter-spacing="3">HAND HEM</text></svg>',
        h: 'Flip it before you <em>donate it again.</em>', sub: 'Shorten, knot, drape. Steps sized to your skill.' }
    };
    var n = +(new URLSearchParams(location.search).get("f") || 1);
    var d = F[n] || F[1];
    document.getElementById("root").innerHTML =
      '<div class="f' + (d.paper ? " paper" : "") + '"><div class="top"><span class="mark">Restitch</span><span class="tag">' + d.tag + '</span></div>' +
      '<div class="art">' + d.art + '</div><h1>' + d.h + '</h1>' + (d.sub ? '<p class="sub">' + d.sub + '</p>' : '') +
      '<div class="foot"><span>Free thrift-flip planner</span><span>No account</span></div></div>';
  </script>
</body>
</html>
