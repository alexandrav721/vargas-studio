<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Restitch explainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --tissue:#EFE3CF; --sheet:#FBF5EA; --ink:#2A211A; --muted:#6B5644; --line:#D8C7AA; --red:#B23A22; --blue:#2F5D8A; --grid:rgba(47,93,138,.08);
      --display:"Young Serif", Georgia, serif; --sans:"Instrument Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background-color: #EFE3CF; overflow: hidden; }
    .g { position: relative; color: var(--ink); font-family: var(--sans); display: grid; padding: 80px;
      background-color: var(--tissue); background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px); background-size: 36px 36px; background-position: -1px -1px; }
    .mark { position: relative; display: inline-block; font: 400 44px/1 var(--display); color: var(--ink); padding-bottom: 12px; }
    .mark::after { content: ""; position: absolute; left: 0; right: 18%; bottom: 0; border-top: 3px dashed var(--red); }
    h1 { margin: 22px 0 0; font: 400 88px/1.02 var(--display); letter-spacing: -0.015em; }
    h1 em { font-style: normal; color: var(--red); }
    .steps { display: grid; gap: 28px; }
    .step { display: grid; grid-template-columns: 150px 1fr; gap: 30px; align-items: center; padding: 26px 28px; background: var(--sheet); border: 2px solid var(--line); border-radius: 2px; }
    .step svg { width: 150px; height: 150px; }
    .num { font: 600 30px var(--mono); color: var(--blue); letter-spacing: 0.08em; }
    .step h2 { margin: 6px 0 8px; font: 400 52px/1 var(--display); }
    .step p { margin: 0; font: 500 30px/1.25 var(--sans); color: var(--muted); }
    .out { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font: 600 30px var(--mono); }
    .out .lbl { color: var(--ink); letter-spacing: 0.06em; text-transform: uppercase; }
    .chip { padding: 12px 20px; background: var(--sheet); border: 2px solid var(--line); border-radius: 2px; color: var(--blue); letter-spacing: 0.04em; text-transform: uppercase; }
    .money { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-top: 24px; border-top: 3px dashed var(--red); font: 500 30px var(--sans); color: var(--muted); }
    .money b { color: var(--ink); font-weight: 700; }
    /* sizes */
    .square { width: 1080px; height: 1080px; grid-template-rows: auto 1fr auto auto; gap: 34px; padding: 64px 72px; }
    .square h1 { font-size: 74px; }
    .square .steps { grid-template-columns: repeat(3, 1fr); gap: 20px; align-content: center; }
    .square .step { grid-template-columns: 1fr; gap: 16px; padding: 24px 22px; align-content: start; }
    .square .step svg { width: 110px; height: 110px; }
    .square .step h2 { font-size: 46px; }
    .wide { width: 1600px; height: 900px; grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto; gap: 30px; padding: 64px 80px; }
    .wide h1 { font-size: 80px; }
    .wide .steps { grid-template-columns: repeat(3, 1fr); gap: 24px; align-content: center; }
    .wide .step { grid-template-columns: 120px 1fr; gap: 22px; }
    .wide .step svg { width: 120px; height: 120px; }
    .story { width: 1080px; height: 1920px; grid-template-rows: auto 1fr auto auto; gap: 48px; padding: 110px 80px 120px; }
    .story h1 { font-size: 100px; }
    .story .steps { align-content: center; gap: 34px; }
    .story .step { padding: 34px 32px; }
    .story .money { flex-direction: column; }
  </style>
</head>
<body>
  <div id="g" class="g">
    <header>
      <div class="mark">Restitch</div>
      <h1>Plan a thrift flip from <em>one photo.</em></h1>
    </header>
    <div class="steps">
      <div class="step">
        <svg viewBox="0 0 150 150" aria-hidden="true"><rect x="14" y="14" width="122" height="122" fill="none" stroke="#2A211A" stroke-width="3"/><path d="M62 30 L70 27 Q75 34 80 27 L88 30 L91 60 Q96 92 100 120 L50 120 Q54 92 59 60 Z" fill="none" stroke="#2A211A" stroke-width="3" stroke-linejoin="round"/><path d="M75 44 V 110 M70 50 L75 44 L80 50 M70 104 L75 110 L80 104" fill="none" stroke="#2F5D8A" stroke-width="2.5"/><rect x="104" y="104" width="22" height="22" fill="#3f5e85" stroke="#2A211A" stroke-width="2"/></svg>
        <div><div class="num">01</div><h2>Photo</h2><p>Reads color, brightness, shape.</p></div>
      </div>
      <div class="step">
        <svg viewBox="0 0 150 150" aria-hidden="true"><rect x="20" y="92" width="30" height="38" fill="#B23A22"/><rect x="60" y="62" width="30" height="68" fill="none" stroke="#2A211A" stroke-width="3"/><rect x="100" y="28" width="30" height="102" fill="none" stroke="#2A211A" stroke-width="3"/><path d="M12 140 H 138" stroke="#B23A22" stroke-width="3" stroke-dasharray="7 5"/></svg>
        <div><div class="num">02</div><h2>Skill</h2><p>Beginner, intermediate or advanced.</p></div>
      </div>
      <div class="step">
        <svg viewBox="0 0 150 150" aria-hidden="true"><g transform="rotate(-14 75 75)"><rect x="6" y="56" width="138" height="38" fill="#FBF5EA" stroke="#2A211A" stroke-width="3"/><g stroke="#2A211A" stroke-width="3"><line x1="20" y1="56" x2="20" y2="80"/><line x1="36" y1="56" x2="36" y2="70"/><line x1="52" y1="56" x2="52" y2="70"/><line x1="68" y1="56" x2="68" y2="80"/><line x1="84" y1="56" x2="84" y2="70"/><line x1="100" y1="56" x2="100" y2="70"/><line x1="116" y1="56" x2="116" y2="80"/><line x1="132" y1="56" x2="132" y2="70"/></g><path d="M14 87 H 136" stroke="#B23A22" stroke-width="2.5" stroke-dasharray="6 4"/></g></svg>
        <div><div class="num">03</div><h2>Tape</h2><p>Your numbers. Never guessed.</p></div>
      </div>
    </div>
    <div class="out"><span class="lbl">You get</span><span class="chip">No-sew</span><span class="chip">Hand</span><span class="chip">Machine</span></div>
    <div class="money"><span><b>Free.</b> No account, no checkout.</span><span>vargas-studio.pages.dev/restitch.html</span></div>
  </div>
  <script>
    var s = new URLSearchParams(location.search).get("size") || "square";
    document.getElementById("g").classList.add(["square", "wide", "story"].indexOf(s) > -1 ? s : "square");
  </script>
</body>
</html>
