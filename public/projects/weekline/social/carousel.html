<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="robots" content="noindex">
<title>Weekline Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<!--
  "How to plan a free week in Brooklyn", 5 slides, 1080x1350. ?s=1..5
  Flow and labels copied from the product (weekline-app/src/data/events.ts: CREWS, ZONES, RADIUS_TIERS, BUDGET_TIERS).
  LIVE PARKS rows: NYC Parks listings 23-27 Nov 2026, NYC Open Data w3wp-dpdi, pulled 21 Nov 2026.
  SAMPLE rows: the app's demo fixtures. "Free" shown only where the listing text says so.
  Look: "Golden Hour" (../v2/app.css). Slides 1 and 5 use real photos from ../v2/photos with credits printed.
  Export: headless Chrome --window-size=1080,1350 --virtual-time-budget=6000 --screenshot=carousel-N.png carousel.html?s=N
-->
<style>
:root{
  --paper:#F4EEE5;--paper-2:#EAE1D3;--ink:#16120E;--ink-2:#5E554B;--rule:rgba(22,18,14,.14);--rule-2:rgba(22,18,14,.26);
  --sun:#EFA937;--sun-deep:#B87414;--sun-text:#8A560C;--dusk:#1A1511;--on-dusk:#EFE6DA;--on-dusk-2:#B3A694;--live:#3F7D4E;--live-text:#346B42;
  --serif:"Bodoni Moda",Didot,"Bodoni 72",serif;--sans:"Jost","Futura","Avenir Next",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;padding:56px 64px 48px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.slide.dusk{background:var(--dusk);color:#fff}
.bg{position:absolute;left:0;top:0;width:100%;height:900px;object-fit:cover}
.scrim{position:absolute;left:0;top:0;width:100%;height:902px;background:linear-gradient(180deg,rgba(26,21,17,.6) 0%,rgba(26,21,17,.3) 24%,rgba(26,21,17,.45) 46%,rgba(26,21,17,.92) 80%,#1A1511 100%)}
.slide>*:not(.bg):not(.scrim){position:relative;z-index:1}
.top{display:flex;align-items:baseline;justify-content:space-between}
.word{font:400 48px/1 var(--serif);letter-spacing:-.01em}
.word::after{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--sun);margin-left:5px;vertical-align:.1em}
.count{font:italic 400 34px/1 var(--serif);color:var(--ink-2)}
.dusk .count{color:var(--on-dusk-2)}
.eyebrow{font:500 26px/1.1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:56px;display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:32px;height:1.5px;background:currentColor}
.dusk .eyebrow{color:rgba(255,255,255,.9)}
h1{font:400 100px/.98 var(--serif);letter-spacing:-.03em;margin-top:18px}
h1 em,h2 em{font-style:italic;color:var(--sun-deep)}
.dusk h1 em,.dusk h2 em{color:var(--sun)}
h2{font:400 96px/.98 var(--serif);letter-spacing:-.03em;margin-top:16px}
.sub{font:400 34px/1.3 var(--sans);color:var(--ink-2);margin-top:20px}
.dusk .sub{color:rgba(255,255,255,.9)}
.grow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:28px;font:400 30px/1.2 var(--sans);color:var(--on-dusk)}
.swipe{font:italic 400 36px/1 var(--serif);color:var(--sun)}
.foot{font:400 27px/1.35 var(--sans);color:var(--ink-2);margin-top:20px}
.foot b{color:var(--ink);font-weight:500}
.credit{margin-top:10px;font:400 22px/1.2 var(--sans);color:var(--on-dusk-2)}

.sheet{background:var(--paper);color:var(--ink);border-radius:2px;position:relative;border:1px solid var(--rule-2)}
.dusk .sheet{border:0;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 30px 16px;border-bottom:1.5px solid var(--ink)}
.sh-title{font:400 40px/1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.sh-meta{font:500 26px/1.1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:18px;padding:6px 30px;min-height:88px;border-bottom:1px solid var(--rule)}
.row:last-of-type{border-bottom:0}
.d{font:400 38px/1 var(--serif)}
.d small{display:block;font:400 26px/1.1 var(--sans);color:var(--ink-2);margin-top:4px}
.t{font:500 31px/1.15 var(--sans);min-width:0}
.t small{display:block;font:400 27px/1.2 var(--sans);color:var(--ink-2);margin-top:4px}
.t.open{font:italic 400 38px/1.1 var(--serif);color:var(--ink-2)}
.t.open small{font-style:normal}
.badge{display:inline-flex;align-items:center;gap:10px;font:500 26px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding:4px 0}
.badge.live{color:var(--live-text)}.badge.live::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--live)}
.badge.sample{color:var(--sun-text);border-bottom:2px dashed currentColor;padding-bottom:6px}
.badge.open{color:var(--ink-2)}.badge.open::before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid currentColor}
.sh-foot{display:flex;justify-content:space-between;padding:14px 30px;border-top:1.5px solid var(--ink);background:var(--paper-2);font:500 26px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}

/* crews */
.crews{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.crew{padding:26px 26px 24px;background:#FBF8F3;border:1.5px solid var(--rule-2);border-radius:3px}
.crew b{display:block;font:400 44px/1 var(--serif);letter-spacing:-.02em}
.crew span{display:block;font:400 28px/1.25 var(--sans);margin-top:12px;color:var(--ink-2)}
.crew.on{background:var(--sun);border-color:var(--sun)}
.crew.on span{color:var(--ink)}
.picked{font:500 28px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-top:34px;display:flex;align-items:center;gap:14px}
.picked::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--sun)}

/* controls */
.group{margin-top:40px}
.group h3{font:500 26px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:18px}
.opts{display:flex;flex-wrap:wrap;gap:14px}
.opt{font:500 32px/1 var(--sans);border:1.5px solid var(--rule-2);border-radius:3px;padding:20px 24px;color:var(--ink)}
.opt small{font:400 28px/1 var(--sans);color:var(--ink-2);margin-left:8px}
.opt.on{background:var(--sun);border-color:var(--sun)}
.opt.on small{color:var(--ink)}

/* send */
.acts{display:flex;flex-direction:column;gap:20px;margin-top:8px}
.act{display:flex;align-items:center;gap:22px;font:500 40px/1 var(--sans);padding:30px 32px;border:1.5px solid rgba(255,255,255,.5);border-radius:3px;color:#fff}
.act.p{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.act svg{flex:none}
.legend{margin-top:40px;display:grid;gap:0;background:var(--paper);color:var(--ink);border-radius:2px;padding:8px 30px}
.legend div{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:20px;font:400 30px/1.2 var(--sans);padding:18px 0;border-bottom:1px solid var(--rule)}
.legend div:last-child{border-bottom:0}
.legend .badge{justify-self:start}
.tilt{}
</style>
</head>
<body>
<div class="slide" id="s"></div>
<script>
var R={
 mon:['Mon','23 Nov','Bodyweight Interval Training','McCarren Park · 6:00 pm','live'],
 tue:['Tue','24 Nov','NYRR Open Run','Brooklyn Bridge Park · 6:45 pm · free','live'],
 wed:['Wed','25 Nov','Open','nothing padded','open'],
 thu:['Thu','26 Nov','Open','Thanksgiving','open'],
 fri:['Fri','27 Nov','Post-Thanksgiving Super Hike','Prospect Park · 12:00 pm','live'],
 sat:['Sat','28 Nov','Prospect Park long loop','Park Slope · 8:00 am · $0','sample'],
 sun:['Sun','29 Nov','Warehouse pop-up market','Bushwick · 12:00 pm · $0','sample']
};
var BL={live:'Live Parks',sample:'Sample',open:'Open'};
function row(k){var r=R[k];return '<div class="row"><div class="d">'+r[0]+'<small>'+r[1]+'</small></div><div class="t'+(r[4]==='open'?' open':'')+'">'+r[2]+'<small>'+r[3]+'</small></div><span class="badge '+r[4]+'">'+BL[r[4]]+'</span></div>';}
function sheet(keys,meta,foot,cls){return '<div class="sheet '+(cls||'')+'"><div class="sh-head"><span class="sh-title">Weekline Sheet</span><span class="sh-meta">'+meta+'</span></div>'+keys.map(row).join('')+(foot?'<div class="sh-foot">'+foot+'</div>':'')+'</div>';}
function hdr(n){return '<div class="top"><span class="word">Weekline</span><span class="count">'+n+' / 5</span></div>';}
function photo(id,pos){return '<img class="bg" src="../v2/photos/'+id+'.jpg" alt="" style="object-position:'+pos+'"><div class="scrim"></div>';}
var FOOT='<p class="foot"><b>LIVE PARKS</b> = NYC Parks listings, 23–29 Nov 2026. <b>SAMPLE</b> = demo row.<br>Check cost on each listing.</p>';
var ARROW='<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 22h26M24 10l12 12-12 12" fill="none" stroke="currentColor" stroke-width="3"/></svg>';
var CAL='<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect x="5" y="9" width="34" height="30" fill="none" stroke="currentColor" stroke-width="3"/><path d="M5 18h34M14 4v9M30 4v9" stroke="currentColor" stroke-width="3"/></svg>';
var S={
 1:function(){return photo('bridge','30% 40%')+hdr(1)+
   '<p class="eyebrow">Brooklyn · week of 23 Nov</p>'+
   '<h1>How to plan a <em>free week</em> in Brooklyn.</h1>'+
   '<p class="sub">Four picks. One Sheet. Every row labeled.</p>'+
   '<div class="grow">'+sheet(['mon','tue','wed'],'Cheap Thrills','',' tilt')+'</div>'+
   '<div class="bottom"><span>Using Weekline’s real flow</span><span class="swipe">Swipe →</span></div><p class="credit">Photo: Brooklyn Bridge at sunset, SebastianBlumeArt, CC BY-SA 4.0</p>';},
 2:function(){var c=[['Cheap Thrills','Maximum city, minimum spend.','',1],['Dateline','One good night, on purpose.',''],['Move Pack','Bodies in motion.',''],['Culture Circuit','Rooms with something on.',''],['Table Hop','Food events, not Yelp.',''],['Wildcard','One weird night, one free find.','']];
   return hdr(2)+'<p class="eyebrow">Step 1</p><h2>Pick a <em>crew.</em></h2><p class="sub">Six crews. Each one shapes the week.</p>'+
   '<div class="grow"><div class="crews">'+c.map(function(x){return '<div class="crew '+x[2]+(x[3]?' on':'')+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div>'+
   '<p class="picked">Picked: Cheap Thrills</p></div>';},
 3:function(){function g(t,o){return '<div class="group"><h3>'+t+'</h3><div class="opts">'+o.map(function(x){return '<span class="opt'+(x[2]?' on':'')+'">'+x[0]+(x[1]?'<small>'+x[1]+'</small>':'')+'</span>'}).join('')+'</div></div>';}
   return hdr(3)+'<p class="eyebrow">Step 2</p><h2>Set your <em>limits.</em></h2><p class="sub">Where you are, how far you’ll go, what you’ll spend.</p>'+
   '<div class="grow">'+g('Zone',[['Manhattan'],['Brooklyn','',1],['Both / I move']])+g('Radius',[['Stay close','~20 min'],['Cross-borough OK','~40 min',1],['Anywhere M+BK']])+g('Budget',[['Free only','',1],['Low','under ~$25'],['Medium'],['Splurge OK']])+'</div>'+
   '<p class="foot">The same choices the app asks, in the same words.</p>';},
 4:function(){return hdr(4)+'<p class="eyebrow">Step 3</p><h2>Get the <em>Sheet.</em></h2><p class="sub">Mon–Sun. Every row says where it came from.</p>'+
   '<div class="grow">'+sheet(['mon','tue','wed','thu','fri','sat','sun'],'Brooklyn · Free only','')+'</div>'+FOOT;},
 5:function(){return photo('domino','50% 60%')+hdr(5)+'<p class="eyebrow">Step 4</p><h2>Send it. <em>Go.</em></h2><p class="sub">The plan leaves the app with you.</p>'+
   '<div class="grow"><div class="acts"><div class="act p">'+ARROW+'Send to the group chat</div><div class="act">'+CAL+'Add to calendar (.ics)</div></div>'+
   '<div class="legend"><div><span class="badge live">Live Parks</span><span>Real NYC Parks listing, public feed</span></div><div><span class="badge sample">Sample</span><span>Demo row, not a real listing</span></div><div><span class="badge open">Open</span><span>Nothing on? It stays empty.</span></div></div></div>'+
   '<div class="bottom"><span>Weekline · early invites, NYC</span><span class="swipe">Check listings before you go</span></div><p class="credit">Photo: Domino Park at sunset, Daniel Prostak, CC BY-SA 4.0</p>';}
};
var n=parseInt(new URLSearchParams(location.search).get('s'),10);if(!S[n])n=1;
document.getElementById('s').innerHTML=S[n]();if(n===1||n===5)document.getElementById('s').classList.add('dusk');document.title='Weekline carousel '+n;
</script>
</body>
</html>
