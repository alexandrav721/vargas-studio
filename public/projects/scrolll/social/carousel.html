<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scrolll — Carousel slides</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--void:#070b10;--panel:#121b26;--paper:#e7eef5;--mute:#a9b6c3;--pay:#c6ff4a;--signal:#3ad7ff;--heat:#ff6b45;--display:"Syne",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--void)}
.studio-back{position:fixed;top:12px;left:12px;z-index:40;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none;background:rgba(7,11,16,.8);border:1px solid rgba(231,238,245,.12);padding:.55rem .8rem}
body.export .studio-back{display:none}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--paper);font-family:var(--sans);padding:84px 80px 76px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 15% 0%,rgba(198,255,74,.15),transparent 55%),radial-gradient(ellipse at 95% 35%,rgba(58,215,255,.12),transparent 50%),var(--void)}
.top{display:flex;justify-content:space-between;font:700 28px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
.top span:last-child{color:var(--mute);letter-spacing:.08em}
h1{font-family:var(--display);font-weight:800;font-size:100px;line-height:.98;letter-spacing:-.04em;margin:56px 0 0}
h1 em{font-style:normal;color:var(--pay)}
.p{font-size:40px;line-height:1.3;color:var(--mute);margin:30px 0 0;max-width:880px}
.p b{color:var(--paper)}
.art{flex:1;display:flex;align-items:center;justify-content:center}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--mute)}
.foot b{font-family:var(--display);font-weight:800;font-size:40px;color:var(--paper);letter-spacing:-.03em}
.swipe{display:flex;align-items:center;gap:12px;color:var(--paper);font-weight:700}
/* card mock */
.card{width:620px;background:#0d141c;border:3px solid rgba(58,215,255,.55);border-radius:36px;overflow:hidden}
.card header{display:flex;align-items:center;gap:20px;padding:24px 28px}
.av{width:64px;height:64px;border-radius:50%;background:var(--pay);display:grid;place-items:center;font:700 30px var(--sans);color:var(--void)}
.card .who{font:700 32px var(--sans)}.card .meta{font-size:28px;color:var(--mute)}
.sp{margin-left:auto;font:700 24px var(--sans);letter-spacing:.12em;background:var(--signal);color:var(--void);padding:8px 14px;border-radius:10px}
.strip{display:flex;align-items:center;gap:18px;padding:22px 28px;border-top:2px solid rgba(58,215,255,.3);background:rgba(58,215,255,.07);font:700 28px var(--sans);color:var(--pay)}
.strip i{flex:1;height:14px;border-radius:9px;background:var(--pay)}
.bar{width:100%;display:flex;height:150px;border-radius:26px;overflow:hidden;font:700 34px var(--sans);color:var(--void)}
.bar div{display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:18px;max-width:900px}
.chip{font:700 34px var(--sans);padding:16px 28px;border-radius:999px;border:3px solid rgba(231,238,245,.3)}
.chip.on{background:var(--pay);color:var(--void);border-color:var(--pay)}
.chip.no{background:var(--heat);color:#1a0a05;border-color:var(--heat)}
.cta{display:inline-block;background:var(--pay);color:var(--void);font:700 40px var(--sans);padding:26px 44px;border-radius:999px}
body:not(.export){min-height:100vh;display:grid;place-items:center;padding:60px 12px 20px}
</style></head><body>
<a class="studio-back" href="/">← Vargas Studio</a>
<div class="c" id="c"></div>
<script>
const arrow='<svg width="44" height="28" viewBox="0 0 44 28"><path d="M2 14h38M28 3l12 11-12 11" stroke="#e7eef5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const feedArt=`<svg width="760" height="560" viewBox="0 0 760 560"><rect x="210" y="10" width="340" height="540" rx="44" fill="none" stroke="#e7eef5" stroke-width="8"/><rect x="250" y="70" width="260" height="120" rx="16" fill="#1c2836"/><rect x="250" y="210" width="260" height="120" rx="16" fill="#1c2836"/><rect x="250" y="350" width="260" height="120" rx="16" fill="#1c2836"/><path d="M40 280h130M590 280h130" stroke="#ff6b45" stroke-width="8" stroke-linecap="round"/><path d="M65 255l-25 25 25 25M695 255l25 25-25 25" stroke="#ff6b45" stroke-width="8" fill="none" stroke-linecap="round"/><text x="105" y="250" font-family="IBM Plex Sans" font-weight="700" font-size="30" fill="#ff6b45" text-anchor="middle">$</text><text x="655" y="250" font-family="IBM Plex Sans" font-weight="700" font-size="30" fill="#ff6b45" text-anchor="middle">$</text></svg>`;
const S=[
 {h:'They sell <em>your eyes.</em>',p:'Every feed already sells your attention. <b>Today you get nothing for it.</b>',art:feedArt},
 {h:'Ads say <em>Sponsored.</em> Always.',p:'Never dressed up as a friend’s post.',art:`<div class="card"><header><span class="av">P</span><div><div class="who">Pellum Running</div><div class="meta">Because you picked Running</div></div><span class="sp">SPONSORED</span></header><svg viewBox="0 0 400 220" width="620" height="340" style="display:block"><rect width="400" height="220" fill="#0f2a22"/><path d="M60 170q20-80 90-95l40 25q40 15 95 18 60 6 70 45v12H60z" fill="#c6ff4a"/><rect x="60" y="182" width="295" height="16" fill="#e7eef5"/></svg><div class="strip">Counted · half on screen, 1 s <i></i></div></div>`},
 {h:'Seen <em>= counted.</em>',p:'Half on screen for <b>1 second</b>. Video: <b>2</b>. Scroll past fast and it doesn’t count.',art:`<svg width="760" height="420" viewBox="0 0 760 420"><rect x="20" y="60" width="720" height="300" rx="30" fill="none" stroke="#e7eef5" stroke-width="6" stroke-dasharray="18 14"/><rect x="20" y="210" width="720" height="150" rx="0" fill="rgba(198,255,74,.18)"/><path d="M20 210h720" stroke="#c6ff4a" stroke-width="6"/><text x="380" y="300" font-family="Syne" font-weight="800" font-size="72" fill="#c6ff4a" text-anchor="middle">50% · 1 s</text><text x="380" y="150" font-family="IBM Plex Sans" font-weight="600" font-size="34" fill="#a9b6c3" text-anchor="middle">off screen</text></svg>`},
 {h:'Every seen ad <em>gets split.</em>',p:'Split is TBD. <b>You see it before you earn a cent.</b>',art:`<div style="width:100%"><div class="bar"><div style="flex:3;background:#c6ff4a">You</div><div style="flex:2;background:#3ad7ff">Creator</div><div style="flex:2;background:#e7eef5">Scrolll</div></div><p class="p" style="font-size:30px;margin-top:22px">Widths are not the real numbers. The real split gets published.</p></div>`},
 {h:'You pick the ads. <em>Or none.</em>',p:'Doomscroll. Earn for attention.',art:`<div><div class="chips"><span class="chip on">Running</span><span class="chip on">Coffee</span><span class="chip on">Thrift</span><span class="chip">Gaming</span><span class="chip no">Never: Gambling</span><span class="chip">Ad-free</span></div><div style="margin-top:60px"><span class="cta">Join early access</span></div></div>`}
];
const q=new URLSearchParams(location.search);let n=Math.min(5,Math.max(1,+q.get('slide')||1));
if(q.has('export'))document.body.classList.add('export');
const c=document.getElementById('c');
c.innerHTML=`<div class="top"><span>Get Paid to Scroll</span><span>${n} / 5</span></div><h1>${S[n-1].h}</h1><p class="p">${S[n-1].p}</p><div class="art">${S[n-1].art}</div><div class="foot"><b>Scrolll</b>${n<5?`<span class="swipe">Swipe ${arrow}</span>`:'<span>vargas-studio.pages.dev/projects/scrolll/join.html</span>'}</div>`;
if(!q.has('export')){const fit=()=>{const s=Math.min(1,(innerWidth-24)/1080,(innerHeight-80)/1350);c.style.transform=`scale(${s})`;c.style.transformOrigin='top center';c.style.marginBottom=`${-(1-s)*1350}px`;c.style.marginLeft=c.style.marginRight=`${-(1-s)*540}px`};fit();addEventListener('resize',fit)}
</script>
</body></html>
