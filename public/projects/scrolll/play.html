<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- hidden 24 Nov 2026 (she asked): this game forwards to the real product. Delete this line and the next to bring it back. -->
  <meta http-equiv="refresh" content="0; url=/projects/scrolll/app.html" /><script>location.replace("/projects/scrolll/app.html");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scrolll — Name your price</title>
  <meta name="description" content="Set what one look at you costs. Brands below it get bounced. Get your receipt. Sample prices; real split TBD." />
  <meta property="og:title" content="What's one look at you worth? — Scrolll" />
  <meta property="og:description" content="Name your price. Brands below it get bounced. Sample prices; real split TBD." />
  <meta name="theme-color" content="#070b10" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./play.css" />
  <link rel="stylesheet" href="/site-bar.css" />
  <script src="/site-bar.js" data-project="scrolll" data-kind="game" defer></script>
</head>
<body class="play-body">
  <a class="studio-back" href="/">← Vargas Studio</a>

  <!-- 1. The door: name your price -->
  <section class="beat is-on" id="beat-door" aria-labelledby="door-ask">
    <svg class="rope-art" viewBox="0 0 320 120" aria-hidden="true">
      <rect x="22" y="20" width="14" height="96" rx="4" fill="#d9b44a" />
      <rect x="284" y="20" width="14" height="96" rx="4" fill="#d9b44a" />
      <circle cx="29" cy="18" r="12" fill="#f0d27a" />
      <circle cx="291" cy="18" r="12" fill="#f0d27a" />
      <path class="rope-line" d="M36 34 Q160 110 284 34" stroke="#ff6b45" stroke-width="10" fill="none" stroke-linecap="round" />
    </svg>
    <p class="friend-line" id="friend-line" hidden></p>
    <h1 class="door-ask" id="door-ask">What's one look at you worth?</h1>
    <div class="dial" role="group" aria-label="Your price">
      <button class="dial-step" type="button" data-step="-1" aria-label="Lower price">−</button>
      <output class="dial-val" id="dial" aria-live="polite"></output>
      <button class="dial-step" type="button" data-step="1" aria-label="Higher price">+</button>
    </div>
    <span class="sample-tag">Sample</span>
    <button class="go-btn" type="button" id="go">Set my price</button>
  </section>

  <!-- 2. Scroll: brands knock, the rope decides -->
  <section class="beat" id="beat-feed" aria-label="Your feed">
    <header class="feed-head">
      <span class="logo">Scrolll</span>
      <span class="my-price" id="my-price"></span>
      <span class="meter" id="meter" role="status" aria-live="polite">
        <b id="amt">0¢</b><small id="cnt"></small>
      </span>
    </header>
    <div class="feed" id="feed"></div>
    <div class="feed-end" id="feed-end" aria-hidden="true"></div>
    <button class="next-btn" type="button" id="next" aria-label="Next post">↓</button>
  </section>

  <!-- Done for now (sheet over the feed) -->
  <div class="done" id="done" role="dialog" aria-modal="false" aria-labelledby="done-title" hidden>
    <h2 class="done-title" id="done-title"></h2>
    <p class="done-sub" id="done-sub"></p>
    <button class="go-btn" type="button" id="print">Print my receipt</button>
    <button class="quiet-link" type="button" id="stay">Keep scrolling</button>
  </div>

  <!-- 3. The receipt -->
  <section class="beat" id="beat-receipt" aria-label="Your receipt">
    <div class="printer" aria-hidden="true"><span></span></div>
    <div class="paper" id="paper">
      <p class="r-head">Receipt for your eyes</p>
      <ul class="r-lines" id="r-lines"></ul>
      <p class="r-row r-total"><span>You kept</span><b id="r-total">0¢</b></p>
      <p class="r-stamp" id="r-stamp"></p>
      <p class="r-foot">Sample · split TBD</p>
    </div>
    <p class="r-friend" id="r-friend" hidden></p>
    <div class="r-actions" id="r-actions">
      <button class="go-btn" type="button" id="send">Send to a friend</button>
    </div>
    <div class="r-more">
      <button class="quiet-link" type="button" id="again" aria-label="Change your price and play again">Again</button>
      <a class="quiet-link" href="./app.html">Try the app</a>
    </div>
  </section>

  <script src="./play.js"></script>
</body>
</html>
