<style>
  @page{size:6in 4in;margin:0}

  /* front */
  .front{background:var(--ink);color:var(--cream)}
  .front .lockup .word{font-size:22pt}
  .front .row{display:flex;justify-content:space-between;align-items:center}
  .front .eyebrow{font-size:7.5pt;color:#c9d1cb}
  .front .eyebrow .dot{background:var(--lime);width:.08in;height:.08in}

  .front .sub{font-family:var(--serif);font-style:italic;font-size:24pt;line-height:1.05;color:var(--lime);margin-top:.14in}
  /* back */
  .back{background:var(--cream);flex-direction:row;gap:.32in;align-items:stretch}
  .back .l{flex:1;display:flex;flex-direction:column}
  .back .kicker{font-family:var(--serif);font-style:italic;font-size:22pt;color:var(--sage);line-height:1}
  .back h2{font-weight:600;font-size:38pt;line-height:.9;letter-spacing:-.04em;margin-top:.06in}
  .back .act{margin-top:auto;font-weight:600;font-size:12pt;line-height:1.2}
  .back .url{font-size:10pt;margin-top:.03in}
  .back .r{width:2.15in;display:flex;flex-direction:column;justify-content:center}
  .back .r .box{background:var(--lime);border-radius:.16in;padding:.15in}
  .back .r .qr{border-radius:.05in}
  @media screen{.sheet{margin:24px auto}}
</style>
</head>
